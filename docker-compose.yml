services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lenny_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lenny_growth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_growth"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: hello-world
    # build:
    #   context: ./backend
    # ports:
    #   - "8000:8000"
    # env_file:
    #   - .env

  frontend:
    image: hello-world
    # build:
    #   context: ./frontend
    # ports:
    #   - "3000:3000"
    # env_file:
    #   - .env

volumes:
  postgres_data:
